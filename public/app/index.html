<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>House Passport — app</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2313402C'/><path d='M5 11l7-5 7 5v7a1 1 0 0 1-1 1h-3v-5h-6v5H6a1 1 0 0 1-1-1z' fill='%23F6F4EF'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F6F4EF;--paper2:#FBFAF8;--white:#fff;--ink:#16160F;--ink2:#46463C;--muted:#71715F;
    --pine:#13402C;--pine2:#0E3122;--moss:#1F6B49;--moss2:#185538;
    --mist:#E8EFE8;--mistline:#D5E1D6;--line:#E6E2D8;--line2:#DAD5C8;
    --warn:#9A5B1A;--warnsoft:#FBF1E3;--danger:#A8321F;--dangersoft:#F8E9E5;
    --fdisp:'Bricolage Grotesque',-apple-system,sans-serif;--f:'Inter',-apple-system,'Segoe UI',sans-serif;
    --sh-sm:0 1px 2px rgba(20,30,20,.05),0 2px 6px rgba(20,30,20,.05);
    --sh:0 12px 26px -12px rgba(19,40,30,.16),0 2px 8px rgba(19,40,30,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  a{color:inherit;text-decoration:none}
  .display{font-family:var(--fdisp);font-weight:600;letter-spacing:-.02em}
  .card{background:var(--white);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-sm)}
  .btn{font-family:var(--f);font-size:13.5px;font-weight:500;padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line2);background:var(--white);color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .12s}
  .btn:hover{border-color:var(--moss)}.btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--pine);border-color:var(--pine);color:var(--paper)}
  .btn.primary:hover{background:var(--pine2)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  input,select{font-family:var(--f);font-size:13.5px;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--white);color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--moss)}
  :focus-visible{outline:2px solid var(--moss);outline-offset:2px}

  .appbar{background:var(--paper2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .appbar .wrap{display:flex;align-items:center;gap:16px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--fdisp);font-weight:600;font-size:16.5px;letter-spacing:-.02em}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--pine);display:flex;align-items:center;justify-content:center}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--white)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dot.up{background:var(--moss)}.dot.down{background:var(--danger)}

  .tabs{border-bottom:1px solid var(--line);background:var(--paper2)}
  .tabs .wrap{display:flex;gap:4px;overflow-x:auto}
  .tab{font-size:14px;font-weight:500;color:var(--muted);padding:14px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--pine);border-bottom-color:var(--pine)}

  main{padding:30px 0 80px}
  .grid2{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
  .stat{padding:15px 17px}
  .stat .v{font-family:var(--fdisp);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
  .sec-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:13px;padding:13px 17px}.row+.row{border-top:1px solid #F1EEE6}
  .ic{width:34px;height:34px;border-radius:8px;background:var(--mist);color:var(--pine);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chip{font-size:11.5px;font-weight:500;color:var(--pine);background:var(--mist);border:1px solid var(--mistline);padding:3px 9px;border-radius:6px;white-space:nowrap}
  .chip.warn{color:var(--warn);background:var(--warnsoft);border-color:#EFE0C4}
  .chip.danger{color:var(--danger);background:var(--dangersoft);border-color:#EFD6CF}
  .chip.muted{color:var(--muted);background:var(--paper);border-color:var(--line)}
  .verified{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--moss);background:var(--mist);border:1px solid var(--mistline);padding:3px 9px;border-radius:999px}
  .muted{color:var(--muted)}.small{font-size:12.5px}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:16px}
  .meta .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}.meta .vv{font-size:14px;font-weight:500}
  .ring{position:relative;width:118px;height:118px}
  .ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .n b{font-family:var(--fdisp);font-size:30px;font-weight:600}
  .addbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:15px 17px;border-bottom:1px solid #F1EEE6;background:var(--paper2);border-radius:13px 13px 0 0}
  .tl{display:flex;gap:13px;padding:11px 17px;align-items:flex-start}
  .tl .dotline{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .tl .d{width:9px;height:9px;border-radius:50%;background:var(--moss);margin-top:5px}
  .tl .line{width:1px;flex:1;background:var(--line);margin-top:3px}
  .empty{padding:54px 20px;text-align:center}
  .check{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--moss);flex-shrink:0}
  .check:hover{border-color:var(--moss);background:var(--mist)}
  h2.ttl{font-family:var(--fdisp);font-size:22px;font-weight:600;letter-spacing:-.02em}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="appbar"><div class="wrap">
    <a class="brand" href="/"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6F4EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>House Passport</a>
    <span id="propwrap"></span>
    <div class="spacer"></div>
    <span class="pill"><span class="dot" id="dot-db"></span>DB<span class="dot" id="dot-redis" style="margin-left:5px"></span>Redis</span>
    <span id="authbtn"></span>
  </div></div>

  <div class="tabs" id="tabs" style="display:none"><div class="wrap" id="tabrow"></div></div>

  <div class="wrap" id="xferbanner"></div>

  <main><div class="wrap" id="view"></div></main>

<script>
const S = { token: localStorage.getItem('hp_token'), props: [], cur: null, tab: 'oversigt' };
const el = (id) => document.getElementById(id);
const H = () => S.token ? { 'Authorization': 'Bearer ' + S.token } : {};
async function api(path, opts){ const r = await fetch(path, Object.assign({ headers: H() }, opts||{})); if(!r.ok) throw new Error('HTTP '+r.status); return r.status===204?null:r.json(); }
function fdate(s){ if(!s) return '–'; try{ return new Date(s).toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return '–'; } }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const TABS = [['oversigt','Oversigt'],['dokumenter','Dokumenter'],['spoerg','Spørg'],['vedligehold','Vedligehold'],['garantier','Garantier'],['deling','Deling'],['historik','Historik']];
const docIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

function renderAuthBtn(){ el('authbtn').innerHTML = S.token ? '<button class="btn sm" onclick="logout()">Log ud</button>' : ''; }
function logout(){ S.token=null; localStorage.removeItem('hp_token'); el('tabs').style.display='none'; el('propwrap').innerHTML=''; renderAuthBtn(); renderAuth(); }

function openCreate(){
  el('tabs').style.display='none'; el('propwrap').innerHTML = S.props.length ? el('propwrap').innerHTML : '';
  el('view').innerHTML =
    '<div style="max-width:480px;margin:30px auto"><div class="card" style="padding:24px">'+
    '<h2 class="ttl" style="margin-bottom:6px">Opret bolig</h2>'+
    '<div class="muted small" style="margin-bottom:16px">S\u00f8g din adresse \u2014 vi henter oplysninger fra BBR automatisk.</div>'+
    '<input id="addr" list="addrlist" placeholder="Fx \u00c6blevej 12, 8000 Aarhus" autocomplete="off" oninput="acInput()" onkeydown="if(event.key===&#39;Enter&#39;)doCreate()" style="width:100%">'+
    '<datalist id="addrlist"></datalist>'+
    '<div id="createerr" class="small" style="color:var(--danger);margin-top:10px;display:none"></div>'+
    '<div style="display:flex;gap:10px;margin-top:16px">'+
      '<button class="btn primary" onclick="doCreate()">Hent fra BBR &amp; opret</button>'+
      (S.props.length?'<button class="btn" onclick="renderProps();selectTab(S.tab||&#39;oversigt&#39;)">Annull\u00e9r</button>':'')+
    '</div></div></div>';
  setTimeout(function(){ var fld=el('addr'); if(fld) fld.focus(); },0);
}
let acTimer=null;
function acInput(){
  clearTimeout(acTimer);
  const q=(el('addr').value||'').trim(); if(q.length<3) return;
  acTimer=setTimeout(async function(){
    try{ const list=await api('/v1/registry/address-autocomplete?q='+encodeURIComponent(q));
      el('addrlist').innerHTML=(list||[]).map(function(sg){return '<option value="'+esc(sg.tekst)+'">';}).join('');
    }catch(e){}
  }, 220);
}
async function doCreate(){
  const address=(el('addr').value||'').trim(); const err=el('createerr'); err.style.display='none';
  if(!address){ el('addr').focus(); return; }
  try{ await api('/v1/properties',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify({ address: address }) }); S.cur=null; await boot(); }
  catch(e){ err.textContent='Kunne ikke oprette ('+e.message+').'; err.style.display='block'; }
}
async function refreshBbr(){
  try{ await api('/v1/properties/'+S.cur+'/refresh-bbr',{ method:'POST' }); toast('Boligdata opdateret fra BBR.', true); viewOversigt(); }
  catch(e){ toast('Kunne ikke hente fra BBR ('+e.message+').', false); }
}

let authMode='login';
function renderAuth(){
  el('tabs').style.display='none'; el('propwrap').innerHTML='';
  const reg = authMode==='register';
  el('view').innerHTML =
    '<div style="max-width:400px;margin:40px auto"><div class="card" style="padding:28px">'+
    '<h2 class="ttl" style="margin-bottom:4px">'+(reg?'Opret konto':'Log ind')+'</h2>'+
    '<div class="muted small" style="margin-bottom:18px">'+(reg?'Kom i gang med din boligs servicebog.':'Velkommen tilbage til House Passport.')+'</div>'+
    '<div id="autherr" class="small" style="color:var(--danger);background:var(--dangersoft);border:1px solid #EFD6CF;border-radius:8px;padding:9px 11px;margin-bottom:12px;display:none"></div>'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+
    (reg?'<input id="a_name" placeholder="Navn (valgfrit)" autocomplete="name">':'')+
    '<input id="a_email" type="email" placeholder="E-mail" autocomplete="username">'+
    '<input id="a_pw" type="password" placeholder="Adgangskode'+(reg?' (mindst 8 tegn)':'')+'" autocomplete="'+(reg?'new-password':'current-password')+'" onkeydown="if(event.key===&#39;Enter&#39;)doAuth()">'+
    '<button class="btn primary" style="justify-content:center;padding:11px" onclick="doAuth()">'+(reg?'Opret konto':'Log ind')+'</button>'+
    '</div>'+
    '<div class="small muted" style="margin-top:16px;text-align:center">'+(reg?'Har du allerede en konto? ':'Ingen konto endnu? ')+
      '<a href="#" style="color:var(--moss);font-weight:500" onclick="authMode=&#39;'+(reg?'login':'register')+'&#39;;renderAuth();return false">'+(reg?'Log ind':'Opret konto')+'</a></div>'+
    '</div></div>';
  setTimeout(function(){ var fld=el('a_email'); if(fld) fld.focus(); },0);
}
async function doAuth(){
  const email=(el('a_email').value||'').trim(), pw=el('a_pw').value||'';
  const err=el('autherr'); err.style.display='none';
  if(!email||!pw){ err.textContent='Udfyld e-mail og adgangskode.'; err.style.display='block'; return; }
  const reg = authMode==='register';
  const body={ email: email, password: pw };
  if(reg){ const n=el('a_name'); if(n&&n.value.trim()) body.displayName=n.value.trim(); }
  try{
    const r = await fetch(reg?'/v1/auth/register':'/v1/auth/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if(!r.ok){ let m='HTTP '+r.status; try{ const t=await r.json(); m=Array.isArray(t.message)?t.message.join(', '):(t.message||m); }catch(_e){} throw new Error(m); }
    const d = await r.json();
    S.token=d.token; localStorage.setItem('hp_token',S.token); renderAuthBtn(); await boot();
  }catch(e){ err.textContent=String(e.message||e); err.style.display='block'; }
}

function renderProps(){
  if(!S.props.length){ el('propwrap').innerHTML=''; return; }
  const opts = S.props.map(p=>'<option value="'+p.id+'"'+(p.id===S.cur?' selected':'')+'>'+esc(p.address)+'</option>').join('');
  el('propwrap').innerHTML = '<select onchange="S.cur=this.value;selectTab(S.tab)" style="max-width:200px">'+opts+'</select>'+
    '<button class="btn sm" onclick="openCreate()" style="margin-left:8px">+ Ny bolig</button>';
}
function renderTabs(){
  el('tabs').style.display='block';
  el('tabrow').innerHTML = TABS.map(([k,l])=>'<div class="tab'+(k===S.tab?' active':'')+'" onclick="selectTab(\''+k+'\')">'+l+'</div>').join('');
}
function selectTab(k){ S.tab=k; renderTabs(); ({oversigt:viewOversigt,dokumenter:viewDokumenter,spoerg:viewSpoerg,vedligehold:viewVedligehold,garantier:viewGarantier,deling:viewDeling,historik:viewHistorik}[k])(); }

function ring(pct){ const off=326.7-(pct/100)*326.7; return '<div class="ring"><svg width="118" height="118" style="transform:rotate(-90deg)"><circle cx="59" cy="59" r="52" fill="none" stroke="#E8EFE8" stroke-width="8"/><circle cx="59" cy="59" r="52" fill="none" stroke="#1F6B49" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.7,0,1)"/></svg><div class="n"><b>'+pct+'</b><span class="small muted">/ 100</span></div></div>'; }
function loading(){ el('view').innerHTML='<div class="card empty muted">Henter…</div>'; }

async function viewOversigt(){
  loading();
  let o; try{ o = await api('/v1/properties/'+S.cur+'/overview'); }catch(e){ el('view').innerHTML='<div class="card empty">Kunne ikke hente oversigt ('+e.message+').</div>'; return; }
  if(!o){ el('view').innerHTML='<div class="card empty">Ingen adgang til denne bolig.</div>'; return; }
  const p=o.property, bbr=p.bbrSnapshot||{};
  const up = o.tasks.upcoming.map(t=>{ const od=t.dueDate&&new Date(t.dueDate)<new Date(); return '<div class="row"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></span><div style="flex:1"><div class="small" style="font-weight:500">'+esc(t.title)+'</div><div class="small muted">'+esc(t.category||'')+'</div></div><span class="chip '+(od?'danger':'muted')+'">'+(t.dueDate?(od?'Overskredet · ':'')+fdate(t.dueDate):'—')+'</span></div>'; }).join('') || '<div class="row muted small">Ingen kommende opgaver.</div>';
  el('view').innerHTML =
    '<div class="grid2">'+
      '<div class="card" style="padding:22px 24px">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:2px"><h2 class="ttl">'+esc(p.address)+'</h2>'+(p.verified?'<span class="verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F6B49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Verificeret</span>':'')+'</div>'+
        '<div class="small muted">'+esc(p.propertyType||'Bolig')+(bbr.areaM2?' · '+bbr.areaM2+' m²':'')+'</div>'+
        '<div class="meta"><div><div class="k">Opført</div><div class="vv">'+esc(p.buildYear||'–')+'</div></div><div><div class="k">Energimærke</div><div class="vv" style="color:var(--moss)">'+esc(p.energyLabel||'–')+'</div></div><div><div class="k">Vurdering</div><div class="vv">'+esc(bbr.estimatedValue||'–')+'</div></div></div>'+(!p.verified?'<button class="btn sm" style="margin-top:16px" onclick="mitidVerify()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Verificér ejerskab med MitID</button>':'')+'<button class="btn sm" style="margin-top:16px;margin-left:8px" onclick="refreshBbr()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Opdater fra BBR</button>'+(p.verified?'<button class="btn sm" style="margin-top:16px;margin-left:8px" onclick="openTransfer()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/></svg>Overdrag bolig</button>':'')+
      '</div>'+
      '<div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:10px">'+ring(o.score)+'<div style="text-align:center"><div class="small" style="font-weight:500">Vedligeholdelsesscore</div><div class="small muted" style="margin-top:2px">Dokumentationsgrad '+o.documents.grade+'%</div></div></div>'+
    '</div>'+
    '<div class="stats">'+
      '<div class="card stat"><div class="v">'+o.documents.total+'</div><div class="l">Dokumenter</div></div>'+
      '<div class="card stat"><div class="v" style="color:var(--moss)">'+o.warranties.active+'</div><div class="l">Aktive garantier</div></div>'+
      '<div class="card stat"><div class="v">'+o.tasks.open+'</div><div class="l">Åbne opgaver</div></div>'+
      '<div class="card stat"><div class="v" style="color:'+(o.tasks.overdue?'var(--danger)':'var(--ink)')+'">'+o.tasks.overdue+'</div><div class="l">Overskredne</div></div>'+
    '</div>'+
    '<div class="card" style="padding:8px 0"><div style="padding:12px 17px 8px"><span class="sec-title">Kommende opgaver</span></div>'+up+'</div>';
}

async function viewDokumenter(){
  loading();
  let docs=[]; try{ docs = await api('/v1/properties/'+S.cur+'/documents'); }catch(e){}
  const rows = docs.map(d=>'<div class="row"><span class="ic">'+docIcon+'</span><div style="flex:1;min-width:0"><div class="small" style="font-weight:500">'+esc(d.filename||'Dokument')+'</div><div class="small muted">'+esc(d.source||'')+' · '+fdate(d.createdAt)+'</div></div>'+docStatus(d)+'</div>').join('') || '<div class="row muted small">Ingen dokumenter endnu.</div>';
  el('view').innerHTML = '<div class="card"><div class="addbar"><span class="sec-title" style="margin:0;flex:1">Dokumenter ('+docs.length+')</span><button class="btn primary sm" onclick="uploadDoc()">Upload dokument</button></div>'+rows+'</div>';
}
function docStatus(d){
  if(d.processingStatus==='processed') return '<span class="chip">'+esc(d.category||'Behandlet')+'</span>';
  if(d.processingStatus==='failed') return '<span style="display:flex;align-items:center;gap:8px"><span class="chip" style="background:var(--dangersoft);color:var(--danger);border:1px solid #EFD6CF">Fejlet</span><button class="btn sm" onclick="doRetry(&#39;'+d.id+'&#39;)">Pr\u00f8v igen</button></span>';
  if(d.processingStatus==='deleted') return '<span class="chip muted">Slettet</span>';
  return '<span class="chip warn">Behandles\u2026</span>';
}
async function doRetry(id){
  try{ await api('/v1/properties/'+S.cur+'/documents/'+id+'/retry',{ method:'POST' }); toast('Genbehandling startet.', true); viewDokumenter(); setTimeout(viewDokumenter, 1500); }
  catch(e){ toast('Kunne ikke genstarte ('+e.message+').', false); }
}
async function uploadDoc(){
  try{ await api('/v1/properties/'+S.cur+'/documents',{ method:'POST', headers:Object.assign({'Content-Type':'application/json','Idempotency-Key':(crypto.randomUUID?crypto.randomUUID():String(Date.now()))},H()), body:JSON.stringify({ filename:'Upload_'+Date.now()+'.txt', contentBase64: btoa('Demo dokument '+new Date().toISOString()) }) });
    viewDokumenter(); setTimeout(viewDokumenter,1100);
  }catch(e){ alert('Upload fejlede ('+e.message+').'); }
}

async function viewSpoerg(){
  el('view').innerHTML =
    '<div class="card" style="padding:22px 24px">'+
      '<h2 class="ttl" style="margin-bottom:4px">Sp\u00f8rg din boligs dokumenter</h2>'+
      '<div class="muted small" style="margin-bottom:16px">Stil et sp\u00f8rgsm\u00e5l \u2014 vi s\u00f8ger i boligens dokumenter og svarer med kilder.</div>'+
      '<div style="display:flex;gap:10px">'+
        '<input id="q" placeholder="Fx Hvorn\u00e5r er taget skiftet? Hvilken maling er brugt?" onkeydown="if(event.key===&#39;Enter&#39;)doAsk()" style="flex:1">'+
        '<button class="btn primary" onclick="doAsk()">Sp\u00f8rg</button>'+
      '</div>'+
      '<div id="answer" style="margin-top:18px"></div>'+
    '</div>';
  setTimeout(function(){ var fld=el('q'); if(fld) fld.focus(); },0);
}
async function doAsk(){
  const q=(el('q').value||'').trim(); if(!q) return;
  el('answer').innerHTML='<div class="muted small">S\u00f8ger\u2026</div>';
  try{
    const r=await api('/v1/properties/'+S.cur+'/ask',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify({ question:q }) });
    let html='<div style="border:1px solid var(--line);border-radius:12px;padding:16px 18px"><div style="white-space:pre-wrap;line-height:1.55">'+esc(r.answer||'')+'</div>';
    if(r.excerpts&&r.excerpts.length){ html+='<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">'+r.excerpts.map(function(x){return '<div class="muted small" style="border-left:3px solid var(--line);padding-left:10px">'+esc(String(x||'').slice(0,300))+'</div>';}).join('')+'</div>'; }
    if(r.sources&&r.sources.length){ html+='<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px">'+r.sources.map(function(sc){return '<span style="display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px" class="muted">'+esc(sc.filename||'dokument')+(sc.category?(' \u00b7 '+esc(sc.category)):'')+'</span>';}).join('')+'</div>'; }
    html+='</div>';
    el('answer').innerHTML=html;
  }catch(e){ el('answer').innerHTML='<div class="small" style="color:var(--danger)">Kunne ikke svare ('+esc(e.message)+').</div>'; }
}
async function viewDeling(){
  loading();
  let shares=[]; try{ shares=await api('/v1/properties/'+S.cur+'/shares'); }catch(e){}
  const rows = (shares||[]).map(function(g){
    return '<div class="row"><span class="ic">'+(personIcon||'')+'</span><div style="flex:1;min-width:0">'+
      '<div class="small" style="font-weight:500">'+esc(g.name||g.email||'Bruger')+'</div>'+
      '<div class="small muted">'+esc(g.email||'')+' \u00b7 '+(g.permission==='write'?'Bidragyder':'L\u00e6ser')+'</div></div>'+
      '<button class="btn sm" onclick="doRevokeShare(&#39;'+g.id+'&#39;)">Fjern</button></div>';
  }).join('') || '<div class="row muted small">Boligen er ikke delt med nogen endnu.</div>';
  el('view').innerHTML =
    '<div class="card" style="padding:22px 24px">'+
      '<h2 class="ttl" style="margin-bottom:4px">Del boligen</h2>'+
      '<div class="muted small" style="margin-bottom:16px">Giv fx din \u00e6gtef\u00e6lle eller en kommende k\u00f8ber adgang til boligens dokumenter. Personen skal have en konto i forvejen.</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<input id="shemail" type="email" placeholder="E-mail" onkeydown="if(event.key===&#39;Enter&#39;)doShare()" style="flex:1;min-width:180px">'+
        '<select id="shrole"><option value="read">L\u00e6ser</option><option value="write">Bidragyder</option></select>'+
        '<button class="btn primary" onclick="doShare()">Inviter</button>'+
      '</div>'+
      '<div id="sherr" class="small" style="color:var(--danger);margin-top:10px;display:none"></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><div class="sec-title" style="margin:0 0 4px">Personer med adgang</div>'+rows+'</div>';
}
async function doShare(){
  const email=(el('shemail').value||'').trim(); const role=el('shrole').value; const err=el('sherr'); err.style.display='none';
  if(!email){ el('shemail').focus(); return; }
  try{ await api('/v1/properties/'+S.cur+'/shares',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify({ email:email, role:role }) }); toast('Adgang givet.', true); viewDeling(); }
  catch(e){ err.textContent=String(e.message||e); err.style.display='block'; }
}
async function doRevokeShare(id){
  try{ await api('/v1/properties/'+S.cur+'/shares/'+id,{ method:'DELETE' }); toast('Adgang fjernet.', true); viewDeling(); }
  catch(e){ toast('Kunne ikke fjerne ('+e.message+').', false); }
}
async function viewVedligehold(){
  loading();
  let tasks=[]; try{ tasks = await api('/v1/properties/'+S.cur+'/tasks'); }catch(e){}
  const open = tasks.filter(t=>t.status!=='done'), done = tasks.filter(t=>t.status==='done');
  const taskRow = t=>{ const od=t.dueDate&&new Date(t.dueDate)<new Date(); return '<div class="row"><button class="check" title="Markér fuldført" onclick="completeTask(\''+t.id+'\')"></button><div style="flex:1"><div class="small" style="font-weight:500">'+esc(t.title)+'</div><div class="small muted">'+esc(t.category||'')+(t.intervalMonths?' · gentages hver '+t.intervalMonths+'. md':'')+'</div></div>'+(t.priority==='high'?'<span class="chip danger">Høj</span>':'')+'<span class="chip '+(od?'danger':'muted')+'">'+(t.dueDate?(od?'Overskredet · ':'')+fdate(t.dueDate):'—')+'</span></div>'; };
  const doneRow = t=>'<div class="row"><span class="ic" style="background:var(--mist)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F6B49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span><div style="flex:1"><div class="small" style="font-weight:500;text-decoration:line-through;color:var(--muted)">'+esc(t.title)+'</div><div class="small muted">Fuldført '+fdate(t.completedAt)+'</div></div></div>';
  el('view').innerHTML =
    '<div class="card" style="margin-bottom:18px"><div class="addbar">'+
      '<input id="t_title" placeholder="Ny opgave, fx Servicér fyr" style="flex:1;min-width:160px">'+
      '<input id="t_cat" placeholder="Kategori" style="width:120px">'+
      '<input id="t_due" type="date" style="width:150px">'+
      '<input id="t_int" type="number" min="0" placeholder="Interval (md)" style="width:130px">'+
      '<button class="btn primary sm" onclick="addTask()">Tilføj opgave</button>'+
    '</div></div>'+
    '<div class="card" style="padding:8px 0;margin-bottom:18px"><div style="padding:12px 17px 8px"><span class="sec-title">Åbne ('+open.length+')</span></div>'+(open.map(taskRow).join('')||'<div class="row muted small">Ingen åbne opgaver.</div>')+'</div>'+
    (done.length?'<div class="card" style="padding:8px 0"><div style="padding:12px 17px 8px"><span class="sec-title">Fuldført</span></div>'+done.map(doneRow).join('')+'</div>':'');
}
async function addTask(){
  const title=el('t_title').value.trim(); if(!title){ el('t_title').focus(); return; }
  const body={ title, category:el('t_cat').value.trim()||undefined, dueDate:el('t_due').value||undefined, intervalMonths: el('t_int').value?Number(el('t_int').value):undefined };
  try{ await api('/v1/properties/'+S.cur+'/tasks',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify(body) }); viewVedligehold(); }
  catch(e){ alert('Kunne ikke tilføje ('+e.message+').'); }
}
async function completeTask(id){ try{ await api('/v1/properties/'+S.cur+'/tasks/'+id+'/complete',{ method:'POST' }); viewVedligehold(); }catch(e){ alert('Fejl ('+e.message+').'); } }

async function viewGarantier(){
  loading();
  let ws=[]; try{ ws = await api('/v1/properties/'+S.cur+'/warranties'); }catch(e){}
  const now=new Date();
  const row = w=>{ const active=!w.endDate||new Date(w.endDate)>now; return '<div class="row"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span><div style="flex:1"><div class="small" style="font-weight:500">'+esc(w.title)+'</div><div class="small muted">'+esc(w.provider||'')+(w.endDate?' · udløber '+fdate(w.endDate):'')+'</div></div><span class="chip '+(active?'':'muted')+'">'+(active?'Aktiv':'Udløbet')+'</span></div>'; };
  el('view').innerHTML =
    '<div class="card" style="margin-bottom:18px"><div class="addbar">'+
      '<input id="w_title" placeholder="Garanti, fx Tag 10 år" style="flex:1;min-width:150px">'+
      '<input id="w_prov" placeholder="Leverandør" style="width:140px">'+
      '<input id="w_end" type="date" title="Udløbsdato" style="width:150px">'+
      '<button class="btn primary sm" onclick="addWarranty()">Tilføj garanti</button>'+
    '</div></div>'+
    '<div class="card" style="padding:8px 0"><div style="padding:12px 17px 8px"><span class="sec-title">Garantier ('+ws.length+')</span></div>'+(ws.map(row).join('')||'<div class="row muted small">Ingen garantier endnu.</div>')+'</div>';
}
async function addWarranty(){
  const title=el('w_title').value.trim(); if(!title){ el('w_title').focus(); return; }
  const body={ title, provider:el('w_prov').value.trim()||undefined, endDate:el('w_end').value||undefined };
  try{ await api('/v1/properties/'+S.cur+'/warranties',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify(body) }); viewGarantier(); }
  catch(e){ alert('Kunne ikke tilføje ('+e.message+').'); }
}

async function viewHistorik(){
  loading();
  let o; try{ o = await api('/v1/properties/'+S.cur+'/overview'); }catch(e){ el('view').innerHTML='<div class="card empty">Kunne ikke hente historik.</div>'; return; }
  const tl = (o&&o.timeline)||[];
  const items = tl.map((e,i)=>'<div class="tl"><div class="dotline"><span class="d"></span>'+(i<tl.length-1?'<span class="line"></span>':'')+'</div><div style="padding-bottom:8px"><div class="small" style="font-weight:500">'+esc(e.label)+'</div><div class="small muted">'+fdate(e.date)+'</div></div></div>').join('') || '<div class="row muted small">Ingen hændelser endnu.</div>';
  el('view').innerHTML = '<div class="card" style="padding:14px 4px"><div style="padding:6px 17px 10px"><span class="sec-title">Boligens historik</span></div>'+items+'</div>';
}

async function mitidVerify(){
  try{ const r = await api('/v1/properties/'+S.cur+'/verification/initiate',{ method:'POST' }); if(r&&r.redirectUrl){ window.location.href = r.redirectUrl; } }
  catch(e){ alert('Kunne ikke starte MitID ('+e.message+').'); }
}
function toast(msg, ok){
  const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:100;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--sh);'+(ok?'background:var(--pine);color:var(--paper)':'background:var(--dangersoft);color:var(--danger);border:1px solid #EFD6CF');
  document.body.appendChild(t); setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(function(){t.remove();},400); }, 3600);
}
async function checkIncoming(){
  const box=el('xferbanner'); if(!box) return;
  let list=[]; try{ list=await api('/v1/transfers/incoming'); }catch(e){ box.innerHTML=''; return; }
  if(!list||!list.length){ box.innerHTML=''; return; }
  box.innerHTML = list.map(function(t){
    return '<div class="card" style="margin-top:14px;border:1px solid var(--moss);background:#eef4f0">'+
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:0"><div style="font-weight:600">Overdragelse af bolig</div>'+
      '<div class="muted small">'+esc(t.sellerName||'En ejer')+' tilbyder at overdrage '+esc(t.address||'en bolig')+' til dig'+(t.saleDate?(' pr. '+fdate(t.saleDate)):'')+'.</div></div>'+
      '<button class="btn primary" onclick="acceptTransfer(&#39;'+t.id+'&#39;)">Accept\u00e9r</button>'+
      '</div></div>';
  }).join('');
}
async function acceptTransfer(id){
  try{ await api('/v1/transfers/'+id+'/accept',{ method:'POST' }); toast('Boligen er overdraget til dig.', true); S.cur=null; await boot(); }
  catch(e){ toast('Kunne ikke accept\u00e9re ('+e.message+').', false); }
}
async function openTransfer(){
  let pending=[]; try{ pending=await api('/v1/properties/'+S.cur+'/transfers'); }catch(e){}
  const pend=(pending&&pending.length)?('<div class="card" style="margin-top:12px"><div class="sec-title" style="margin:0 0 4px">Afventende tilbud</div>'+pending.map(function(t){return '<div class="row"><div style="flex:1;min-width:0"><div class="small">'+esc(t.toEmail)+'</div><div class="muted small">pr. '+fdate(t.saleDate)+' \u00b7 afventer accept</div></div><button class="btn sm" onclick="cancelTransfer(&#39;'+t.id+'&#39;)">Annull\u00e9r</button></div>';}).join('')+'</div>'):'';
  el('view').innerHTML =
    '<div class="card" style="padding:22px 24px">'+
      '<h2 class="ttl" style="margin-bottom:4px">Overdrag bolig</h2>'+
      '<div class="muted small" style="margin-bottom:16px">Ved salg overdrages boligen med hele servicebogen til k\u00f8beren. K\u00f8beren skal have en konto og accept\u00e9re tilbuddet, hvorefter de selv MitID-verificerer ejerskabet.</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px;max-width:420px">'+
        '<input id="bemail" type="email" placeholder="K\u00f8berens e-mail">'+
        '<label class="muted small">Salgsdato<input id="bdate" type="date" style="margin-top:4px;display:block"></label>'+
        '<div style="display:flex;gap:8px"><button class="btn primary" onclick="doTransfer()">Send tilbud</button><button class="btn" onclick="selectTab(&#39;oversigt&#39;)">Tilbage</button></div>'+
      '</div>'+
      '<div id="xfererr" class="small" style="color:var(--danger);margin-top:10px;display:none"></div>'+
    '</div>'+pend;
}
async function doTransfer(){
  const email=(el('bemail').value||'').trim(); const date=el('bdate').value; const err=el('xfererr'); err.style.display='none';
  if(!email){ el('bemail').focus(); return; }
  try{ const r=await api('/v1/properties/'+S.cur+'/transfer',{ method:'POST', headers:Object.assign({'Content-Type':'application/json'},H()), body:JSON.stringify({ buyerEmail:email, saleDate:date||undefined }) });
    toast(r.buyerHasAccount?'Tilbud sendt til k\u00f8ber.':'Tilbud oprettet. K\u00f8ber skal oprette en konto med denne e-mail for at accept\u00e9re.', true);
    openTransfer();
  }catch(e){ err.textContent=String(e.message||e); err.style.display='block'; }
}
async function cancelTransfer(id){ try{ await api('/v1/transfers/'+id+'/cancel',{ method:'POST' }); toast('Tilbud annulleret.', true); openTransfer(); }catch(e){ toast(String(e.message||e),false); } }
async function boot(){
  try{ S.props = await api('/v1/properties'); }catch(e){ S.props=[]; }
  if(S.token) checkIncoming();
  if(!S.props.length){ el('tabs').style.display='none'; el('propwrap').innerHTML=''; if(S.token){ el('view').innerHTML='<div class="card empty"><h2 class="ttl">Ingen bolig endnu</h2><div class="muted" style="margin:8px 0 16px">Opret din første bolig for at komme i gang.</div><button class="btn primary" onclick="openCreate()">+ Opret bolig</button></div>'; } else renderAuth(); return; }
  if(!S.cur || !S.props.find(p=>p.id===S.cur)) S.cur = S.props[0].id;
  renderProps(); selectTab(S.tab);
}

fetch('/health').then(r=>r.json()).then(d=>{ el('dot-db').className='dot '+(d.db==='up'?'up':'down'); el('dot-redis').className='dot '+(d.redis==='up'?'up':(d.redis==='disabled'?'':'down')); }).catch(()=>{ el('dot-db').className='dot down'; });

const _params=new URLSearchParams(location.search); const _v=_params.get('verified');
if(_v){ history.replaceState({},'', '/app/'); }
renderAuthBtn();
(S.token?boot():Promise.resolve(renderAuth())).then(function(){ if(_v==='1') toast('Ejerskab verificeret med MitID.', true); else if(_v==='0') toast('MitID-verificering blev ikke gennemført.', false); });
</script>
</body>
</html>
